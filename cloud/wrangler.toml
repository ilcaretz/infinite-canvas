name = "infinite-canvas"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Static web app. run_worker_first = true: every request (pages included) passes the Worker's login check
# before env.ASSETS.fetch serves the file.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "infinite-canvas"
database_id = "3c3f37a9-7b0c-45b9-8d67-ae198cff3e3c"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "infinite-canvas-board"
remote = true   # wrangler dev uses the real bucket (presigned uploads land there); ignored by deploy

# daily trash purge (items deleted > 30 days ago)
[triggers]
crons = ["17 4 * * *"]

[vars]
S3_BUCKET = "infinite-canvas-board"
S3_REGION = "auto"
PRESIGN_TTL_S = "3600"
MAX_FILE_GB = "5"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit):
#   USERS                 name:pbkdf2$<iterations>$<saltB64>$<hashB64>,name2:...   (node scripts/hash-password.mjs)
#   SESSION_SECRET        long random string, signs the session cookie
#   S3_ENDPOINT           https://<ACCOUNT_ID>.r2.cloudflarestorage.com
#   S3_ACCESS_KEY_ID      R2 S3 credential (Object Read and Write on the bucket)
#   S3_SECRET_ACCESS_KEY  R2 S3 credential
