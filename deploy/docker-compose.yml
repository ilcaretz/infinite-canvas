# docker compose -f deploy/docker-compose.yml up -d --build        (run from the app root; settings come from ./.env)
services:
  board:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0        # inside the container; the published port below is still loopback-only on the host
      DATA_DIR: /data
      TRUST_PROXY: "true"  # a reverse proxy / tunnel in front: real client IPs + Secure cookie over https
    ports:
      - "127.0.0.1:5180:5180"
    volumes:
      - board-data:/data   # board.sqlite + tmp\ (and the media too when STORAGE_DRIVER=local)
volumes:
  board-data:
